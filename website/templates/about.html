{% extends "base.html" %}
{% block title %}About AYUDA{% endblock %}

{% block content %}
<div class="relative scroll-smooth overflow-hidden">
    <!-- Hero Section with Enhanced Background -->
    <div class="bg-cover bg-center h-screen parallax relative"
        style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.3)), url('{{ url_for('static', filename='images/') }}');">
        
        <!-- Animated background overlay -->
        <div class="absolute inset-0 bg-gradient-to-br from-blue-900/20 via-transparent to-purple-900/20"></div>
        
        <!-- Desktop Layout -->
        <div class="relative container mx-auto px-4 h-full d-none d-md-flex flex-col justify-center">
            <div class="max-w-2xl text-white fade-in-left">
                <h1 class="text-6xl md:text-7xl lg:text-8xl font-bold mb-4 text-stroke leading-tight">
                    AYUDA
                </h1>
                <p class="text-2xl md:text-3xl mb-6 font-semibold text-blue-100 fade-in-left stagger-1">
                    "AYUDA"
                </p>
                <p class="text-lg md:text-xl mb-8 text-gray-200 leading-relaxed fade-in-left stagger-2">
                    Eliminate bias and inequality, distribute government support equally.
                </p>
                <a href="#about"
                    class="inline-block btn-primary text-white font-bold py-4 px-8 rounded-full transition-all duration-300 shadow-2xl fade-in-left stagger-3">
                    <span class="relative z-10">About</span>
                </a>
            </div>
        </div>

{% endblock %}
